scalar join__FieldSet

enum join__Graph {
  ORDERS @join__graph(name: "orders", url: "http://home-orders.home-orders.svc.cluster.local/graphql")
  USERS @join__graph(name: "users", url: "http://home-users.home-users.svc.cluster.local/graphql")
