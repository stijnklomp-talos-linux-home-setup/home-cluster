"""The federated `Order` entity (`@key(fields: "id")`)."""
type Order
  @join__type(graph: ORDERS, key: "id")
{
  """The federation key."""
  id: ID!

  """Reference to the users subgraph's `User` entity."""
  userId: ID!

  """Total in minor units (cents)."""
  total: Int!

  """Order status (`pending`, `paid`, `shipped` or `cancelled`)."""
  status: String!

  """Creation timestamp (ISO 8601, no timezone suffix)."""
  createdAt: String!

  """
  The user who placed the order: a federation reference only. The users
  subgraph resolves `name`/`email` for this representation.
  """
  user: User!
}

type Query
  @join__type(graph: ORDERS)
  @join__type(graph: USERS)
{
  """
  A page of orders: the caller's unless the token has `orders:admin`.
  
  Two `requires_scopes` values are two OR groups:
  `@requiresScopes(scopes: [["orders:read"], ["orders:admin"]])`. A single
  space-separated value would emit one AND group, so keep them separate.
  """
  orders(page: Int! = 1, perPage: Int! = 100): [Order!]! @join__field(graph: ORDERS) @requiresScopes(scopes: [["orders:read"], ["orders:admin"]])

  """A single order by id; a different owner is denied."""
  order(id: ID!): Order @join__field(graph: ORDERS) @requiresScopes(scopes: [["orders:read"], ["orders:admin"]])

  """The caller authenticated by the bearer token."""
  viewer: Viewer! @join__field(graph: USERS)

  """A page of users, ordered by id."""
  users(page: Int! = 1, perPage: Int! = 100): [User!]! @join__field(graph: USERS) @requiresScopes(scopes: [["users:read"]])

  """A single user by id: visible to self or with `users:read`."""
  user(id: ID!): User @join__field(graph: USERS)
}

scalar requiresScopes__Scope

"""The federated `User` entity (`@key(fields: "id")`)."""
type User
  @join__type(graph: ORDERS, key: "id", resolvable: false)
  @join__type(graph: USERS, key: "id")
{
  """The federation key."""
  id: ID!

  """Display name."""
  name: String! @join__field(graph: USERS)

  """Creation timestamp (ISO 8601, no timezone suffix)."""
  createdAt: String! @join__field(graph: USERS)

  """
  Initials derived from the display name: "Ada Lovelace" -> "AL".
  
  A computed field, not a column: it only exists in the SDL, so a change
  to it is a pure schema change that the gateway can pick up without a
  subgraph image rebuild of the gateway or a Hive restart.
  """
  initials: String! @join__field(graph: USERS)

  """
  Contact address: the caller's own verified record, or any user with
  `users:read`. No `@requiresScopes` here: the gateway cannot express
  "self or scope", so this resolver is the guard (and still applies to
  direct subgraph calls).
  """
  email: String! @join__field(graph: USERS)
}

"""The authenticated caller, resolved from the JWT context."""
type Viewer
  @join__type(graph: USERS)
{
  """Token `sub` claim."""
  subject: String

  """Token `email` claim (the caller's own address)."""
  email: String

  """Whether the token's email claim is verified."""
  emailVerified: Boolean!

  """Local user id from `user_id`/`custom:user_id` or a numeric `sub`."""
  userId: Int

  """Token scopes."""
  scopes: [String!]!
}