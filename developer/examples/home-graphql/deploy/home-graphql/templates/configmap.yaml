# Gateway configuration and supergraph. The supergraph ConfigMap is mounted as
# a directory and polled by Hive (see gateway.config.mjs), so a schema change
# is a ConfigMap update, not a pod restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-graphql.fullname" . }}-config
  labels:
    {{- include "home-graphql.labels" . | nindent 4 }}
data:
  gateway.config.mjs: |-
{{ .Files.Get "files/gateway.config.mjs" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-graphql.fullname" . }}-supergraph
  labels:
    {{- include "home-graphql.labels" . | nindent 4 }}
data:
  supergraph.graphql: |-
{{ .Files.Get "files/supergraph.graphql" | indent 4 }}
