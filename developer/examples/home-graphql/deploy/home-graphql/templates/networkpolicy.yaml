# Cilium L3/L4 policy for the gateway. Ambient intercepts every flow into
# ztunnel (HBONE, port 15008), so the policy allows the HBONE hops; caller
# identity is enforced by the STRICT PeerAuthentication above and the JWT
# check in the gateway. No edge route exists, so ingress is limited to callers
# in this namespace (the verification caller) and host probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "home-graphql.fullname" . }}
  labels:
    {{- include "home-graphql.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "home-graphql.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
        {{- range .Values.networkPolicy.callerNamespaces }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ . }}
        {{- end }}
    - fromEntities:
        - host
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Required for the `toFQDNs` rule below: Cilium only learns the
          # Cognito addresses when DNS responses pass through this proxy.
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        {{- range .Values.networkPolicy.backendNamespaces }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ . }}
        {{- end }}
      toPorts:
        - ports:
            # Ambient delivers calls to the subgraph and the JWKS server
            # through the destination pod's HBONE listener.
            - port: "15008"
              protocol: TCP
            - port: "80"
              protocol: TCP
    # Production fetches the Cognito JWKS over HTTPS. The host comes from the
    # configured JWKS URL, so no pool id is committed here. With the
    # `<region>`/`<pool>` placeholders (or the HTTP in-cluster test JWKS) the
    # rule is omitted: Cilium rejects a matchName that is not a DNS name.
    {{- $jwks := urlParse .Values.config.jwksUri }}
    {{- if and (eq $jwks.scheme "https") $jwks.host (not (contains "<" $jwks.host)) }}
    - toFQDNs:
        - matchName: {{ $jwks.host | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
