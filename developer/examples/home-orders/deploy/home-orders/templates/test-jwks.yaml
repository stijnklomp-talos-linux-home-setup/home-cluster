# Test-only JWKS + token issuer. Serves the public half of the committed
# GraphQL test key (tests/fixtures/graphql-test-key.pem) over HTTP inside the
# namespace. Disabled by default; production uses Cognito (ticket #17).
{{- if .Values.testJwks.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-orders.fullname" . }}-jwks
  labels:
    {{- include "home-orders.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-jwks
data:
  jwks.json: |
    {{- .Files.Get "files/test-jwks.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "home-orders.fullname" . }}-jwks
  labels:
    {{- include "home-orders.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-jwks
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "home-orders.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: test-jwks
  template:
    metadata:
      labels:
        {{- include "home-orders.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: test-jwks
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jwks
          image: {{ .Values.testJwks.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: jwks
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /jwks.json
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: jwks
          configMap:
            name: {{ include "home-orders.fullname" . }}-jwks
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "home-orders.fullname" . }}-jwks
  labels:
    {{- include "home-orders.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-jwks
spec:
  type: ClusterIP
  selector:
    {{- include "home-orders.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: test-jwks
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
