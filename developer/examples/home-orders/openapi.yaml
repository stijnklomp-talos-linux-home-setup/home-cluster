openapi: 3.1.0
info:
  title: home-orders
  description: 'home-orders: REST + optional Federated GraphQL orders subgraph'
  license:
    name: MIT
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: 'Liveness: the process is up. Always 204.'
      operationId: healthz
      responses:
        '204':
          description: The process is up
  /readyz:
    get:
      tags:
      - health
      summary: |-
        Readiness: 204 when every registered check passes, problem+json 503
        otherwise. Failure messages are logged, not exposed.
      operationId: readyz
      responses:
        '204':
          description: Every registered check passes
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/orders:
    get:
      tags:
      - orders
      summary: '`GET /v1/orders`: one page of orders.'
      operationId: get_orders
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: perPage
        in: query
        description: Orders per page, at most 100 (0 returns an empty page).
        required: true
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/orders/{id}:
    get:
      tags:
      - orders
      summary: '`GET /v1/orders/{id}`: one order, or problem+json 404.'
      operationId: get_order
      parameters:
      - name: id
        in: path
        description: Order id.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No order with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Order:
      type: object
      description: An order (one `orders` table row).
      required:
      - id
      - userId
      - total
      - status
      - createdAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
        id:
          type: integer
          format: int64
          description: Federation key and primary key.
        status:
          type: string
          description: One of [`ORDER_STATUSES`].
        total:
          type: integer
          format: int64
          description: Order total in minor units (cents); money is never a float.
        userId:
          type: integer
          format: int64
          description: Reference to the `User` entity in the users subgraph (federation key).
    OrdersResponse:
      type: object
      description: '`GET /v1/orders` response body.'
      required:
      - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          description: The requested page of orders.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Human-readable explanation for this occurrence.
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProblemError'
          description: Validation details (extension member, ADR-0005).
        instance:
          type:
          - string
          - 'null'
          description: URI of the specific occurrence.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          minimum: 0
        title:
          type: string
          description: Short human-readable summary of the problem type.
        type:
          type: string
          description: URI identifying the problem type.
    ProblemError:
      type: object
      description: One entry in the `errors` validation extension member.
      required:
      - detail
      properties:
        detail:
          type: string
          description: What is wrong with the value.
        pointer:
          type:
          - string
          - 'null'
          description: JSON Pointer of the offending field.
tags:
- name: health
- name: orders
