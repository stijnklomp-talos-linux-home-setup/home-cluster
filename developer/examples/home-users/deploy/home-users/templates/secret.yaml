{{- $password := include "home-users.postgresPassword" . -}}
# The Postgres credentials and the app's DATABASE_URL. The password is
# generated on first install and reused through `lookup` on upgrades; no
# credential is committed to the repository.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "home-users.postgresSecretName" . }}
  labels:
    {{- include "home-users.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.username (urlquery $password) (include "home-users.fullname" .) .Values.postgres.database | quote }}
