apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: git-clone
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request, push]"
    pipelinesascode.tekton.dev/on-target-branch: "[*]"
spec:
  taskRunTemplate:
    podTemplate:
      securityContext:
        # Every task in the shared catalog runs as UID/GID 65532; fsGroup makes
        # the PVC writable by that identity across steps.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 1Gi
          storageClassName: longhorn
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
  pipelineSpec:
    params:
      - name: repo-url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: basic-auth
    tasks:
      - name: clone
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone-v1
            - name: namespace
              value: tekton-pipelines
        params:
          - name: url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)