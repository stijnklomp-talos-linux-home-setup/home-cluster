apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: terragrunt-plan-
  # Runs in the deploy tenant namespace. `home-terraform-plans` is now a
  # per-deploy-tenant PVC (values/platform.yaml), not a shared control-plane
  # volume, so this PipelineRun and its plan storage live in the same namespace.
  namespace: stijnklomp-talos-linux-home-setup
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request, push]"
    pipelinesascode.tekton.dev/on-target-branch: "[*]"
spec:
  taskRunTemplate:
    podTemplate:
      securityContext:
        # Every task in the shared catalog runs as UID/GID 65532; fsGroup makes
        # the PVC writable by that identity across steps.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: repo-name
      value: "{{ repo_name }}"
    - name: branch-name
      value: "{{ branch_name }}"
    - name: terragrunt-dir
      value: "envs/prod"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 1Gi
          storageClassName: longhorn
    - name: plans
      persistentVolumeClaim:
        claimName: home-terraform-plans
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
  pipelineRef:
    name: terragrunt-plan-v1