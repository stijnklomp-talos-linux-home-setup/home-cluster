# Staging + prod release: push a v* tag on main -> build :<git_tag> -> pin
# staging and record the release for prod in the app declaration. Staging
# auto-syncs; prod goes OutOfSync and waits for a manual Sync in ArgoCD.
# Copy to <app-repo>/.tekton/cd-staging.yaml and replace the TODO placeholders.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: app-cd-staging-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/v*]"
spec:
  taskRunTemplate:
    podTemplate:
      securityContext:
        # Every task in the shared catalog runs as UID/GID 65532; fsGroup makes
        # the PVC writable by that identity across steps.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
  # The Pipeline lives in the shared catalog namespace; PaC runs this
  # PipelineRun in the tenant namespace, so resolve it with the cluster
  # resolver instead of a bare name.
  pipelineRef:
    resolver: cluster
    params:
      - name: kind
        value: pipeline
      - name: name
        value: app-release-v1
      - name: namespace
        value: tekton-pipelines
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    # TODO: replace <DOCKERHUB_USERNAME> and <APP>
    - name: image
      value: "docker.io/<DOCKERHUB_USERNAME>/<APP>:{{ git_tag }}"
    # TODO: replace <APP> (must match the declaration in developer/apps/)
    - name: gitops-file
      value: "developer/apps/baremetal/<APP>.yaml"
    - name: gitops-set
      value:
        - "imageTagStaging={{ git_tag }}"
        - "targetRevisionStaging={{ git_tag }}"
        - "imageTagProd={{ git_tag }}"
        - "targetRevisionProd={{ git_tag }}"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 1Gi
          storageClassName: longhorn
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: docker-credentials
      secret:
        secretName: dockerhub-docker-config
    - name: gitops-auth
      secret:
        secretName: gitops-pat
