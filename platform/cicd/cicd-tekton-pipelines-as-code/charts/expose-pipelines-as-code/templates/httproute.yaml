# PaC is served by the internal Istio gateway (edge cutover, ticket #12).
# TLS terminates at the Gateway listener (`https-pac`, certificate
# `internal-tls` in istio-ingress); this route only forwards plaintext to the
# controller in the same namespace, so no ReferenceGrant is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pipelines-as-code
  # Hardcoded: this release is installed into the `default` namespace (it has
  # no namespace in helmfile.yaml), while the controller lives here.
  namespace: pipelines-as-code
  labels:
    pipelines-as-code/route: controller
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pipelines-as-code-controller
          port: 8080
