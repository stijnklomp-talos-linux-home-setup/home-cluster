apiVersion: v1
kind: ConfigMap
metadata:
  name: pipelines-as-code-info
  namespace: pipelines-as-code
data:
  # Webhooks reach the controller via the gosmee relay (hook.pipelinesascode.com
  # -> gosmee-client -> controller) until a domain + Cloudflare Tunnel exist.
  controller-url: "https://pipelines-as-code.192.168.1.200.sslip.io"
  tekton-dashboard-url: "https://tekton.192.168.1.200.sslip.io"
  provider: "GitHub App"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipelines-as-code
  namespace: pipelines-as-code
data:
  tekton-dashboard-url: "https://tekton.192.168.1.200.sslip.io"
  # Auto-configure is OFF. The tenant registry (tenant-platform/values/tenants.yaml)
  # is the only way a repository becomes PaC-enabled: only the platform creates
  # Repository CRs. An unregistered owner that installs the GitHub App creates
  # no namespace, no Repository CR and no PipelineRun.
  #
  # No auto-configure-repo-namespace-template / -repository-template: they are
  # only read when auto-configure is on, and the single-namespace path they
  # encoded is retired. The upstream manifest ships both keys with empty
  # defaults; null deletes them from the live ConfigMap so no stale template
  # survives. The GitHub App's 'repository' event is now optional.
  auto-configure-new-github-repo: "false"
  auto-configure-repo-namespace-template: null
  auto-configure-repo-repository-template: null
  # Hardening: /ok-to-test comments must include the commit SHA (GitHub only).
  require-ok-to-test-sha: "true"
