{{- range $tenant := .Values.tenants }}
---
# Workload identity for PipelineRuns in this namespace. No RoleBinding and no
# automounted token: `build` tenants cannot talk to the API server, and
# `deploy` tenants get API access through the network policy, not through this
# service account's RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-bot
  namespace: {{ $tenant.namespace }}
automountServiceAccountToken: false
{{- end }}
