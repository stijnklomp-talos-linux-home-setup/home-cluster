# COPY to secrets/argocd-secrets.yaml and fill in real values (gitignored).
# Merged AFTER values/argocd-values.yaml by helmfile, so `configs.cm.oidc.config`
# below is the complete block (block scalars cannot be merged piecewise).

# --- Cognito OIDC (from terragrunt output of home-cluster-terraform-aws-cognito-federation
# prod/cognito: `terragrunt output argocd_client_id` / `argocd_client_secret`) ---
configs:
  cm:
    oidc.config: |
      name: Cognito
      issuer: https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_hYEQJIIaf
      clientID: <argocd-client-id>
      clientSecret: $oidc.argocd.oidcSecret
      requestedScopes:
        - openid
        - email
        - profile
  secret:
    extra:
      oidc.argocd.oidcSecret: "<argocd-client-secret>"

---
# --- GitHub PAT for ArgoCD repo access (org credential template) -----------
# kubectl apply -f secrets/argocd-github-creds.yaml
# PAT: contents:read on home-cluster under
# stijnklomp-talos-linux-home-setup
apiVersion: v1
kind: Secret
metadata:
  name: argocd-github-creds
  namespace: argo
type: Opaque
stringData:
  username: "<github-username>"
  password: "<github-pat>"