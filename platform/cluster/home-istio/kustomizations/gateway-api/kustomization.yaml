# Gateway API CRDs (standard channel) from the upstream release, vendored so
# the base layer does not depend on the network at install time.
#
# Version: v1.5.1 — the runbook requires >= 1.5, and Istio 1.31 supports the
# v1.5.x channel. Refresh with:
#   curl -sSLo standard-install.yaml \
#     https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml
#
# CRDs are cluster-scoped; the helmfile release only exists to make apply and
# delete explicit. The experimental channel is not needed: TLSRoute (Pinniped
# passthrough) is in the standard channel as of v1.5.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - standard-install.yaml
