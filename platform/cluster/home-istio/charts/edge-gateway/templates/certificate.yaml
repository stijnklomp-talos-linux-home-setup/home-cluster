# One multi-SAN certificate for every HTTPS-terminated edge host. A single
# Certificate means a single renewal and a single Secret for all three
# listeners.
#
# The cert-manager Gateway shim (`config.gatewayAPI.enabled`) is deliberately
# off; this explicit Certificate is the source of truth. Pinniped hosts are
# absent on purpose: their TLS is passthrough and they serve their own certs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/part-of: home-istio
spec:
  secretName: {{ .Values.certificate.secretName }}
  issuerRef:
    kind: {{ .Values.certificate.issuerKind }}
    name: {{ .Values.certificate.issuerName }}
  dnsNames:
    - {{ printf "%s.%s" .Values.hosts.argocd .Values.hostSuffix | quote }}
    - {{ printf "%s.%s" .Values.hosts.tekton .Values.hostSuffix | quote }}
    - {{ printf "%s.%s" .Values.hosts.pipelinesAsCode .Values.hostSuffix | quote }}
