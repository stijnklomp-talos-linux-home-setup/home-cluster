# Plain HTTP is only a redirector. The three UI hosts jump to HTTPS with a
# permanent redirect; Pinniped hosts have no HTTP listener (a TLS passthrough
# route cannot be reached over plaintext). The explicit port avoids relying on
# implementation-specific default-port inference.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/part-of: home-istio
spec:
  parentRefs:
    - name: istio-internal
      namespace: {{ .Release.Namespace }}
      sectionName: http
  hostnames:
    - {{ printf "%s.%s" .Values.hosts.argocd .Values.hostSuffix | quote }}
    - {{ printf "%s.%s" .Values.hosts.tekton .Values.hostSuffix | quote }}
    - {{ printf "%s.%s" .Values.hosts.pipelinesAsCode .Values.hostSuffix | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
